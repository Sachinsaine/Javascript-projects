<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>

        <div class="job-card" data-job-id="101">
            <h2>Frontend Developer</h2>
        </div>
    </div>

    <script>

        const arr = ["Frontend Developer", "frontend developer", "FRONTEND DEVELOPER"]
        let seen = {}
        let temp = []
        let newArr = arr.map((title) => title.toLocaleLowerCase())

        for (let char of newArr) {

            if (!seen[char]) {
                seen[char] = true
                temp.push(char)
            }
        }
        console.log(temp);

    </script>
</body>

</html>
